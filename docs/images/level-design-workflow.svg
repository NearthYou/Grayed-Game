<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">맵 수정 작업 흐름 개선</title>
  <desc id="desc">스프레드시트 전달과 프로그래머 재배치를 거치던 작업을 기획자가 Unity에서 직접 배치하고 확인하는 흐름으로 바꾼 과정</desc>
  <defs>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="#f8fafc"/>
  <text x="70" y="80" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#0f172a">맵 수정이 사람을 거치던 흐름을 줄였습니다</text>

  <rect x="70" y="130" width="1460" height="240" rx="28" fill="#fff7f7" stroke="#fecaca" stroke-width="3"/>
  <rect x="95" y="155" width="130" height="48" rx="24" fill="#dc2626"/>
  <text x="160" y="188" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#ffffff">기존</text>
  <text x="250" y="190" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="24" fill="#991b1b">작은 수정도 전달과 재배치를 기다려야 했습니다</text>

  <rect x="110" y="235" width="285" height="90" rx="20" fill="#ffffff" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="252" y="273" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d">기획자가 표 수정</text>
  <text x="252" y="306" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#991b1b">좌표와 배치 전달</text>
  <path d="M395 280 H495" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>

  <rect x="525" y="235" width="285" height="90" rx="20" fill="#ffffff" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="668" y="273" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d">프로그래머 재배치</text>
  <text x="668" y="306" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#991b1b">Unity 장면 수정</text>
  <path d="M810 280 H910" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>

  <rect x="940" y="235" width="235" height="90" rx="20" fill="#ffffff" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058" y="273" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d">실행 파일 확인</text>
  <text x="1058" y="306" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#991b1b">결과 전달</text>
  <path d="M1175 280 H1275" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>

  <rect x="1305" y="235" width="175" height="90" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1392" y="273" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#991b1b">다시 수정</text>
  <text x="1392" y="306" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#991b1b">반복</text>

  <rect x="70" y="405" width="1460" height="240" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <rect x="95" y="430" width="130" height="48" rx="24" fill="#2563eb"/>
  <text x="160" y="463" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#ffffff">개선</text>
  <text x="250" y="465" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="24" fill="#1e40af">기획자가 배치와 확인을 한 자리에서 끝냅니다</text>

  <rect x="175" y="510" width="350" height="90" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="350" y="548" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Unity에서 직접 배치</text>
  <text x="350" y="581" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#1e40af">클릭, 드래그, 겹침 확인</text>
  <path d="M525 555 H665" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <rect x="695" y="510" width="300" height="90" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="845" y="548" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">같은 장면 재생</text>
  <text x="845" y="581" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#1e40af">별도 전달 없음</text>
  <path d="M995 555 H1135" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <rect x="1165" y="510" width="260" height="90" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1295" y="548" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">바로 결과 확인</text>
  <text x="1295" y="581" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#1e40af">수정과 검토 반복</text>

  <text x="70" y="710" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#0f172a">편집 화면과 실제 게임은 같은 설정을 읽습니다</text>

  <rect x="130" y="755" width="330" height="90" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="295" y="792" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#334155">맵 제작 도구</text>
  <text x="295" y="825" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#64748b">편집할 때 사용</text>
  <path d="M460 800 H600" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>

  <rect x="630" y="735" width="340" height="130" rx="22" fill="#111827"/>
  <text x="800" y="785" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#ffffff">맵 설정 데이터</text>
  <text x="800" y="827" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#cbd5e1">크기, 이미지, 충돌, 차지한 칸</text>
  <path d="M970 800 H1110" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>

  <rect x="1140" y="755" width="330" height="90" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1305" y="792" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#334155">실제 게임</text>
  <text x="1305" y="825" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" fill="#64748b">플레이할 때 사용</text>
</svg>
